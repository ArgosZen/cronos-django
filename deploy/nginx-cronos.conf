server {
    listen 80;
    server_name cronos.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cronos.local;

    ssl_certificate     /etc/ssl/cronos/cronos.crt;
    ssl_certificate_key /etc/ssl/cronos/cronos.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /static/ {
        alias /var/www/cronos-django/static/;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
